# project.yml — configuración del proyecto que leen los agentes.
#
# Formato: pares `clave: valor` de una sola línea, sin anidamiento. Lo parsea
# `agents/config.py` sin PyYAML a propósito, para que el arnés funcione en un
# repo recién clonado antes de instalar nada.
#
# Si renombras el paquete, `project_slug` es lo que hay que cambiar aquí.

project_name: MeshHarmes
project_slug: app
project_author_name: cacelass
project_description: TinyVigo: mapa isometrico pixel art de todo el centro de Vigo para quien pasea con el movil. Se dibuja una vez offline con un modelo de imagen (teselas con costuras) y el sol, la noche y el clima van por codigo. Encima van los puntos navidenos con horario real, eventos del dia, rutas a pie de 3 opciones, autobuses y trenes segun horario, y postales pixel-art a partir de una foto propia. Criterio de hecho: ver vault/01_PROYECTO/objetivo.md (zona completa dibujada y aceptada, rutas en menos de 2 s, primer vistazo en menos de 3 s en 4G, demo en dispositivo real). Fuera de alcance: area metropolitana, GPS real de buses, afluencia, venta de entradas, cuentas, juegos, LoRA propia. Sistemas externos: PNOA (IGN), edificios 3D y capa de Navidad y agenda del Concello, OpenStreetMap, Catastro, GTFS de Vitrasa y Renfe, Open-Meteo, modelo de imagen en Vertex AI.
project_version: 0.1.0
# La versión del .venv. uv la resuelve desde requires-python en pyproject.toml.
python_version: 3.12

# Capacidades: los agentes las consultan para no ofrecer acciones sobre
# infraestructura que este proyecto no tiene.
use_api: false
use_docker: false
use_cli: true

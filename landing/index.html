<!doctype html>
<html lang="es" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NaviVigo — el mapa de la Navidad de Vigo</title>
    <meta name="description" content="NaviVigo: mapa isométrico del centro de Vigo en Navidad. Puntos con horario oficial, eventos del día, paseos a pie y el tiempo en un solo sitio. Nació en 1Hack (A Coruña, 14/11/2026) y sigue en desarrollo." />
    <meta name="theme-color" content="#1b1f2c" />
    <link rel="canonical" href="https://navivigo.vercel.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="NaviVigo" />
    <meta property="og:title" content="NaviVigo — el mapa de la Navidad de Vigo" />
    <meta property="og:description" content="Las luces, los sitios y los planes de la Navidad de Vigo sobre un mapa ilustrado del centro. Con horarios oficiales y paseos a pie." />
    <meta property="og:url" content="https://navivigo.vercel.app/" />
    <meta property="og:image" content="https://navivigo.vercel.app/og.jpg" />
    <meta property="og:locale" content="es_ES" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Apply the saved theme before the first paint so it never flashes.
      (function () {
        var stored;
        try { stored = localStorage.getItem('site-theme'); } catch (e) {}
        document.documentElement.dataset.theme = stored === 'dark' ? 'dark' : 'light';
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
